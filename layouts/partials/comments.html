{{- if (and .Site.Params.comments (ne .Params.comments false)) -}}
<link rel="stylesheet" href="/vendor/waline/waline.css" />
<div id="waline"></div>
<script type="module">
  import { init } from '/vendor/waline/waline.js';
  init({
    el: '#waline',
    serverURL: 'https://comments.v2er.org',
    lang: 'zh-CN',
    pageview: true,
    comment: true,
  });
</script>
{{- end -}}
