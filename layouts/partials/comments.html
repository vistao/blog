{{- if (and .Site.Params.comments (ne .Params.comments false)) -}}
<link rel="stylesheet" href="/vendor/waline/waline.css" />
<div id="waline"></div>
<script defer src="/vendor/waline/waline.js"></script>
<script>
  window.addEventListener('load', function () {
    if (window.Waline) {
      window.Waline.init({
        el: '#waline',
        serverURL: 'https://comments.v2er.org',
        lang: 'zh-CN',
        pageview: true,
        comment: true
      });
    }
  });
</script>
{{- end -}}
