name = "waline-on-worker"
main = "src/index.js"
compatibility_date = "2024-08-01"

[[d1_databases]]
binding = "DB"
database_name = "blog-comments"
database_id = "01646a40-44f1-486c-ac11-6318bb1684a4"

[vars]
SITE_URL = "https://blog.v2er.org"
AUTO_APPROVE = "false"
ADMIN_EMAIL = "me@v2er.org"

# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_ADMIN_CHAT_ID, TELEGRAM_WEBHOOK_SECRET
# Route comments.v2er.org/* is bound in Cloudflare dashboard (legacy Waline worker name).
